@let p = product();
<div class="promo" [class]="'promo--' + p.slug + ' promo--basis-' + basis()">
  <div class="promo__content">
    <h2 class="promo__title">{{ p.title }}</h2>
    <p class="promo__desc">{{ p.lead }}</p>
    <a class="promo__btn" [href]="p.url" target="_blank" rel="noopener">
      <span>Получить полный доступ</span>
      <svg class="promo__arrow" width="49" height="8" viewBox="0 0 49 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M0.5 3.18201C0.223858 3.18201 2.41411e-08 3.40586 0 3.68201C-2.41411e-08 3.95815 0.223858 4.18201 0.5 4.18201L0.5 3.68201L0.5 3.18201ZM48.8536 4.03556C49.0488 3.8403 49.0488 3.52372 48.8536 3.32846L45.6716 0.146477C45.4763 -0.0487853 45.1597 -0.0487854 44.9645 0.146477C44.7692 0.341739 44.7692 0.658321 44.9645 0.853584L47.7929 3.68201L44.9645 6.51044C44.7692 6.7057 44.7692 7.02228 44.9645 7.21754C45.1597 7.41281 45.4763 7.41281 45.6716 7.21754L48.8536 4.03556ZM0.5 3.68201L0.5 4.18201L48.5 4.18201L48.5 3.68201L48.5 3.18201L0.5 3.18201L0.5 3.68201Z"
          fill="currentColor"
        />
      </svg>
    </a>
  </div>
  <div class="promo__img-wrapper">
    <img class="promo__img" [src]="p.image" alt="" />
    <div class="promo__gradient"></div>
  </div>
</div>
