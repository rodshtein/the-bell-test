@let l = line();
<div class="root">
  <div
    class="line"
    [class]="'basis-' + l.basis"
    [style.min-height.px]="l.minHeight"
    [style.grid-template-columns]="columns()"
  >
    @for (cell of l.cells; track $index) {
      <div class="line-widget" [class.basis-50]="cell.basis === 50">
        @if (cell.contentItem; as item) {
          @if (item.__typename === 'Post' || item.__typename === 'ExternalPost') {
            <app-widget-news [contentItem]="item" [basis]="cell.basis" />
          } @else if (item.__typename === 'SubscriptionList') {
            <app-widget-subscription [contentItem]="item" [basis]="cell.basis" />
          } @else if (item.__typename === 'EventList') {
            <app-widget-event [contentItem]="item" [basis]="cell.basis" />
          }
        }
      </div>
    }
  </div>
</div>
